<ion-header mode="ios">
  <ion-toolbar style="--background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); --color: white;">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/transport/transport-dashboard" color="light" text=""></ion-back-button>
    </ion-buttons>
    <ion-title style="font-weight: 600; font-size: 1.2rem; color: white;">
      {{ 'TRANSPORT_MENU.NOTIFICATIONS' | translate }}
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <!-- List of Notifications -->
  <ion-list>
    <ion-item *ngFor="let notification of notifications">
      <ion-icon [name]="notification.icon" [color]="notification.color"></ion-icon>
      <ion-label>
        <h3>{{ notification.title }}</h3>
        <p>{{ notification.message }}</p>
        <p><small>{{ notification.time }}</small></p>
      </ion-label>
    </ion-item>
  </ion-list>
</ion-content>
