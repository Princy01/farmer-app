<ion-header>
  <ion-toolbar class="update-stock-toolbar">
    <ion-title>{{ 'UPDATE_STOCK.PAGE_TITLE' | translate }}</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="close()">{{ 'UPDATE_STOCK.CLOSE' | translate }}</ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-item>
    <ion-label position="floating">{{ 'UPDATE_STOCK.STOCK_TO_DEDUCT' | translate }}</ion-label>
    <ion-input
      type="number"
      [(ngModel)]="stockToDeduct"
      [disabled]="isLoading"
      min="1"
      step="1"
    ></ion-input>
  </ion-item>

  <ion-button
    color="tertiary"
    expand="block"
    class="ion-margin-top"
    (click)="updateStock()"
    [disabled]="isLoading"
  >
    <ion-spinner *ngIf="isLoading" name="crescent"></ion-spinner>
    <span *ngIf="!isLoading">{{ 'UPDATE_STOCK.UPDATE' | translate }}</span>
  </ion-button>
</ion-content>
