<ion-header>
  <ion-toolbar class="offer-modal-toolbar">
    <ion-title>{{ 'MAKE_OFFER.TITLE' | translate }}</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="close()">{{ 'MAKE_OFFER.CLOSE' | translate }}</ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-item>
    <ion-label position="floating">
      {{ 'MAKE_OFFER.OFFER_PRICE' | translate }}
    </ion-label>
    <ion-input
      type="number"
      [(ngModel)]="offerPrice"
      min="0"
      required>
    </ion-input>
  </ion-item>

  <ion-item>
    <ion-label position="floating">
      {{ 'MAKE_OFFER.DELIVERY_DATE' | translate }}
    </ion-label>
    <ion-input
      type="date"
      [(ngModel)]="proposedDeliveryDate"
      required>
    </ion-input>
  </ion-item>

  <ion-item>
    <ion-label position="floating">
      {{ 'MAKE_OFFER.MESSAGE' | translate }}
    </ion-label>
    <ion-textarea [(ngModel)]="message"></ion-textarea>
  </ion-item>

  <ion-button
    expand="block"
    class="ion-margin-top"
    (click)="submitOffer()"
    [disabled]="offerPrice <= 0 || !proposedDeliveryDate || isSubmitting">
    {{ 'MAKE_OFFER.SUBMIT' | translate }}
  </ion-button>
</ion-content>
