<div class="language-switcher" role="group" aria-label="Language">
  <ion-segment
    mode="ios"
    [value]="currentLang"
    (ionChange)="switchLanguage($event.detail.value)">
    <ion-segment-button *ngFor="let lang of languages" [value]="lang.code">
      <ion-label>{{ lang.label }}</ion-label>
    </ion-segment-button>
  </ion-segment>
</div>
