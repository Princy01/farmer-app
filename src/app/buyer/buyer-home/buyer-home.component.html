<ion-header mode="ios" [class.hidden]="hideHeader" id="main-content">
  <ion-toolbar class="main-toolbar">
    <ion-buttons slot="start" mode="ios">
      <ion-menu-button (click)="openMenu()">
        <ion-icon name="menu-outline" size="large"></ion-icon>
      </ion-menu-button>
    </ion-buttons>

    <ion-title class="app-title">Farmer App</ion-title>

    <ion-buttons slot="end">
      <ion-button (click)="openTrends()" class="header-btn">
        <ion-icon name="stats-chart-outline" slot="icon-only"></ion-icon>
      </ion-button>
      <ion-button [routerLink]="'/buyer/wishlist'" class="header-btn">
        <ion-icon name="heart-outline"></ion-icon>
      </ion-button>
      <ion-button [routerLink]="'/buyer/cart'" class="header-btn">
        <ion-icon name="cart-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>

      <div class="location-info">

      </div>
      <ion-icon
        name="chevron-forward-outline"

    </div>
  </div> -->
</ion-header>

<ion-menu side="start" menuId="buyer-menu" contentId="buyer-main-content" class="custom-menu">
  <ion-header>
    <ion-toolbar class="menu-toolbar">
      <ion-title class="menu-title">Menu</ion-title>
      <ion-buttons slot="end">
        <ion-button (click)="closeMenu()" class="menu-close-btn">
          <ion-icon name="close-outline"></ion-icon>
        </ion-button>
      </ion-buttons>
    </ion-toolbar>
  </ion-header>

  <ion-content class="menu-content">
    <ion-list class="menu-list">
      <ion-item button (click)="navigateToProfile()" lines="none" class="menu-item">
        <ion-icon
          name="person-outline"
          slot="start"
          class="menu-icon"
        ></ion-icon>
        <ion-label>Profile</ion-label>
      </ion-item>
      <ion-item button (click)="navigateToTrackOrders()" lines="none" class="menu-item">
        <ion-icon
          name="archive-outline"
          slot="start"
          class="menu-icon"
        ></ion-icon>
        <ion-label>Track Orders</ion-label>
      </ion-item>
      <ion-item button (click)="navigateToBusinessLocations()" lines="none" class="menu-item">
        <ion-icon
          name="location-outline"
          slot="start"
          class="menu-icon"
        ></ion-icon>
        <ion-label>Business Locations</ion-label>
      </ion-item>
      <ion-item button (click)="navigateToUpdateBusiness()" lines="none" class="menu-item">
        <ion-icon
          name="create-outline"
          slot="start"
          class="menu-icon"
        ></ion-icon>
        <ion-label>Update Business</ion-label>
      </ion-item>
      <ion-item button (click)="navigateToSettings()" lines="none" class="menu-item">
        <ion-icon
          name="settings-outline"
          slot="start"
          class="menu-icon"
        ></ion-icon>
        <ion-label>Settings</ion-label>
      </ion-item>
      <ion-item button (click)="logout()" lines="none" class="menu-item logout-item">
        <ion-icon name="log-out-outline" slot="start" class="menu-icon logout-icon"></ion-icon>
        <ion-label class="logout-label">Logout</ion-label>
      </ion-item>
    </ion-list>
  </ion-content>
</ion-menu>

<!-- Sticky search bar when scrolling -->
<ion-header class="sticky-searchbar" *ngIf="hideHeader">
  <ion-toolbar class="sticky-toolbar">
    <ion-searchbar
      placeholder="Search products..."
      class="sticky-search"
    ></ion-searchbar>
  </ion-toolbar>
</ion-header>

<ion-content
  id="buyer-main-content"
  scrollEvents="true"
  (ionScroll)="onScroll($event)"
  class="main-content"
>
  <!-- Inline search bar -->
  <div class="search-container">
    <ion-searchbar
      placeholder="Search products..."
      class="main-searchbar"
    ></ion-searchbar>
  </div>

  <!-- Categories section -->
  <div class="categories-section">
    <!-- Loading State -->
    <div class="loading-container" *ngIf="loadingCategories">
      <ion-spinner name="crescent" color="primary"></ion-spinner>
      <p class="loading-text">Loading categories...</p>
    </div>

    <!-- Error State -->
    <div class="error-container" *ngIf="errorLoadingCategories">
      <ion-icon name="alert-circle-outline" class="error-icon"></ion-icon>
      <h4>Unable to load categories</h4>
      <p>Please check your connection and try again</p>
      <ion-button
        fill="outline"
        size="small"
        (click)="fetchCategories()"
        class="retry-btn"
      >
        <ion-icon name="refresh-outline" slot="start"></ion-icon>
        Retry
      </ion-button>
    </div>

    <!-- Categories grid -->
    <ion-grid
      class="categories-grid"
      *ngIf="!loadingCategories && !errorLoadingCategories"
    >
      <div class="section-header">
        <h1 class="section-title">
          <ion-icon name="grid-outline" class="title-icon"></ion-icon>
          Explore Our Collections
        </h1>
      </div>

      <ion-row>
        <ion-col
          size="6"
          size-md="6"
          size-lg="3"
          *ngFor="let category of categories"
          class="category-col"
        >
          <ion-card
            [routerLink]="['/buyer/category', category.category_id]"
            class="category-card"
          >
            <div class="card-image-container">
              <img
                [src]="category.img_path"
                [alt]="category.category_name"
                class="category-image"
                (error)="onImageError($event.target)"
              />
              <div class="card-overlay"></div>
              <div class="card-arrow">
                <ion-icon name="chevron-forward-outline"></ion-icon>
              </div>
            </div>

            <ion-card-content class="category-content">
              <h3 class="category-name">
                <b>{{ category.category_name }}</b>
              </h3>
              <div class="category-stats">
                <span class="product-count">Fresh & Quality</span>
              </div>
            </ion-card-content>
          </ion-card>
        </ion-col>
      </ion-row>
    </ion-grid>
  </div>
</ion-content>
