<ion-header>
  <ion-toolbar>
    <ion-title>{{ product.product_name }}</ion-title>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/buyer/buyer-home"></ion-back-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  <!-- General Product Info -->
  <ion-card>
    <img [src]="product.image_path" alt="{{ product.product_name }}" />
    <ion-card-header>
      <ion-card-title>{{ product.product_name }}</ion-card-title>
    </ion-card-header>

    <ion-card-content>
      <p>{{ product.description }}</p>
      <p><b>Nutrition:</b> {{ product.nutrition_factor }}</p>
    </ion-card-content>

    <!-- Wholesaler Info Vertical Scroll -->
    <div class="wholesaler-vertical-scroll">
      <ion-card *ngFor="let wholesaler of wholesalers">
        <ion-card-header
          style="
            display: flex;
            justify-content: space-between;
            align-items: center;
          "
        >
          <ion-card-title>{{ wholesaler.name }}</ion-card-title>
          <ion-icon
            name="heart-outline"
            slot="end"
            style="font-size: 1.5em; color: #e74c3c; cursor: pointer"
          ></ion-icon>
        </ion-card-header>
        <ion-card-content>
          <p><b>Quantity:</b> {{ wholesaler.quantity }} Kg</p>
          <p><b>Price:</b> ₹{{ wholesaler.price }}</p>
          <p><b>Distance:</b> {{ wholesaler.distance }}</p>
          <div
            style="
              display: flex;
              align-items: center;
              justify-content: space-between;
              margin-top: 8px;
            "
          >
            <ion-button size="small" color="primary"> Add to Cart </ion-button>
            <span
              style="
                display: flex;
                align-items: center;
                font-size: 1em;
                margin-left: 8px;
              "
            >
              <ion-icon
                name="star"
                style="color: #f4d03f; margin-right: 4px"
              ></ion-icon>
              {{ wholesaler.rating || 4.2 }}
            </span>
          </div>
        </ion-card-content>
      </ion-card>
    </div>
  </ion-card>
</ion-content>
