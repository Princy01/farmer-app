<ion-menu contentId="console-content">
  <ion-header>
    <ion-toolbar class="console-toolbar">
      <ion-title>{{ getConsoleLabel() }}</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-content class="console-menu-content">
    <ion-list>
      <ion-menu-toggle auto-hide="false" *ngFor="let item of menuItems">
        <ion-item [routerLink]="item.path" [ngClass]="{ selected: isActive(item.path) }">
          <ion-icon [name]="item.icon" slot="start"></ion-icon>
          <ion-label>{{ item.label }}</ion-label>
        </ion-item>
      </ion-menu-toggle>
    </ion-list>
  </ion-content>
</ion-menu>

<div class="ion-page" id="console-content">
  <ion-header>
    <ion-toolbar class="console-toolbar console-main-toolbar">
      <ion-buttons slot="start">
        <ion-menu-button></ion-menu-button>
      </ion-buttons>
      <ion-title>{{ pageTitle }}</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-content class="console-shell-content">
    <ion-router-outlet></ion-router-outlet>
  </ion-content>
</div>
